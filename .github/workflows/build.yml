name: Build RedZone Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Ordenar carpetas automáticamente
        run: |
          mkdir -p /tmp/rz/java /tmp/rz/layout
          find app -name "AndroidManifest.xml" -exec cp {} /tmp/rz/AndroidManifest.xml \;
          find app -name "activity_main.xml" -exec cp {} /tmp/rz/layout/activity_main.xml \;
          find app -name "*.java" -exec cp {} /tmp/rz/java/ \;
          rm -rf app/app
          mkdir -p app/app/src/main/res/layout app/app/src/main/java/com/htown/redzonepro
          cp /tmp/rz/AndroidManifest.xml app/app/src/main/AndroidManifest.xml
          cp /tmp/rz/layout/activity_main.xml app/app/src/main/res/layout/activity_main.xml
          cp /tmp/rz/java/*.java app/app/src/main/java/com/htown/redzonepro/

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Subir APK listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: RedZone-Pro-HUD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
